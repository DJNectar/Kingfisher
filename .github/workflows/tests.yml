# Runs the unit suite on every push and pull request.
#
# No `npm install` step: the app and its unit tests have zero runtime
# dependencies, and node's built-in test runner needs nothing installed. The
# only devDependency (playwright-core) is used solely by the browser test,
# which is not run here — see the note at the bottom of this file.

name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

# The end-to-end browser test (`npm run test:browser`) is deliberately not run
# here. It needs a Chromium download and a running local server, which would
# turn a two-second job into a multi-minute one for a single-user project. Run
# it locally when touching the UI:
#
#   node test/browser/make-fixtures.mjs
#   python3 -m http.server 8181 &
#   npm install && npm run test:browser
